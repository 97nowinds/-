<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实验室通知管理</title>
<style>body{margin:0;background:#091828;color:#e7eef6;font:16px system-ui}main{max-width:1050px;margin:32px auto;padding:24px}section,article{background:#11283c;border:1px solid #29465e;border-radius:12px;padding:20px;margin:16px 0}input,button,textarea{font:inherit;padding:10px;border-radius:6px;border:1px solid #45677f}button{cursor:pointer;background:#8fd9cb}textarea{width:95%;min-height:180px}small{color:#b3c6d5}h1{font-size:28px}.line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}</style></head><body><main>
<h1>实验室通知与告警管理</h1><p>人员进入 · 仪器交互 · 口罩检测</p>
<section><div class="line"><input id="token" type="password" autocomplete="off" placeholder="输入分配的管理访问令牌"><button id="login">连接</button><button id="logout">退出</button><button id="refresh">刷新</button></div><p id="status">访问令牌仅保留在本页内存中。页面关闭后需要重新输入。</p></section>
<section id="admin" hidden><h2>群通知路由</h2><p>只填写环境变量名称，Webhook 和签名密钥在服务器配置。修改会持久保存。</p><textarea id="routes" spellcheck="false"></textarea><p><button id="save">保存路由</button></p></section>
<h2>事件记录</h2><div id="events">连接后显示权限范围内的记录。</div>
<small>未确认身份、过期结果和未确认的交互不会生成实名告警。通知权限适用于本管理模块。</small>
</main><script>
let token='', role='';const $=id=>document.getElementById(id);
async function api(path,body){const response=await fetch('/api/management/'+path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');return result;}
const labels={'person.entered':'进入实验室','instrument.started':'正在操作仪器','safety.no_mask':'未戴口罩'};
async function refresh(){try{const data=await api('events');role=data.role;$('status').textContent='权限：'+role+'；数据采集：'+data.poll_status;$('events').replaceChildren();for(const e of data.events){const a=document.createElement('article');const h=document.createElement('h3');h.textContent=(e.display_name||'身份已确认人员')+' · '+labels[e.event_type];a.append(h);const p=document.createElement('p');p.textContent=[e.instrument_name||e.instrument_id||'',e.lab_id,e.observed_at].filter(Boolean).join(' / ');a.append(p);const s=document.createElement('p');s.textContent='群通知：'+(e.deliveries.map(d=>d.route_id+': '+d.state).join('；')||'未匹配群路由')+'；处理：'+(e.acknowledged_by||'待处理');a.append(s);if(['admin','manager'].includes(role)&&!e.acknowledged_by){const b=document.createElement('button');b.textContent='确认已处理';b.onclick=async()=>{try{await api('ack',{event_id:e.event_id});await refresh();}catch(err){$('status').textContent=err.message;}};a.append(b);}$('events').append(a);}if(!data.events.length)$('events').textContent='当前权限范围内暂无事件。';$('admin').hidden=role!=='admin';if(role==='admin')$('routes').value=JSON.stringify((await api('routes')).routes,null,2);}catch(err){$('status').textContent=err.message;}}
$('login').onclick=()=>{token=$('token').value;$('token').value='';refresh();};$('refresh').onclick=refresh;$('logout').onclick=()=>{token='';role='';$('admin').hidden=true;$('routes').value='';$('events').replaceChildren();$('status').textContent='已退出';};$('save').onclick=async()=>{try{await api('routes',{routes:JSON.parse($('routes').value)});$('status').textContent='路由已保存';}catch(err){$('status').textContent=err.message;}};
</script></body></html>
