<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>双海康人脸识别追踪</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>双海康人脸识别追踪</h1>
          <p>人脸确认 · 侧脸/背身持续跟踪 · 跨摄像头身份继承</p>
        </div>
        <div class="topbar-actions">
          <button id="recordingControlButton" class="tool-link recording-launch" type="button">
            <span class="recording-dot" aria-hidden="true"></span>
            <span id="recordingControlLabel">录像</span>
          </button>
          <a id="recordingReviewLink" class="tool-link" href="/recordings">路线复核</a>
          <a id="faceCaptureLink" class="tool-link" href="/faces">人脸采集</a>
          <a id="calibrationLink" class="tool-link" href="/annotate">地图四点标定</a>
          <span id="serviceState" class="service-state">连接中</span>
        </div>
      </header>

      <section class="summary-grid">
        <article>
          <span>摄像头状态</span>
          <strong id="cameraSummary">检查中</strong>
        </article>
        <article>
          <span>当前注册身份</span>
          <strong id="identitySummary">尚未确认</strong>
        </article>
        <article>
          <span>跨镜头状态</span>
          <strong id="handoffSummary">等待目标</strong>
        </article>
      </section>

      <section class="monitoring-layout">
        <section class="video-grid" id="videoGrid"></section>
        <aside class="floor-map-panel">
          <header>
            <div>
              <h2>实验室实时位置</h2>
              <span id="floorMapMode">示意映射</span>
            </div>
            <strong id="floorMapCount">0 人</strong>
          </header>
          <div class="floor-map-viewport">
            <svg id="floorMapSvg" viewBox="0 0 1200 700" role="img" aria-label="实验室人员实时位置俯视图">
              <g id="floorMapStatic"></g>
              <g id="floorMapTrails"></g>
              <g id="floorMapPeople"></g>
            </svg>
          </div>
          <div class="floor-map-legend" aria-label="地图图例">
            <span><i class="legend-person identified"></i>已确认</span>
            <span><i class="legend-person unknown"></i>未注册</span>
            <span><i class="legend-overlap"></i>重叠区</span>
          </div>
          <div id="floorMapPeopleList" class="floor-map-people-list">
            <span class="empty">当前没有活动目标</span>
          </div>
        </aside>
      </section>

      <section class="people-panel">
        <header>
          <h2>已注册人员</h2>
          <span>使用原有样本库</span>
        </header>
        <div id="peopleList" class="people-list"></div>
      </section>
    </main>

    <dialog id="recordingDialog" class="recording-dialog" aria-labelledby="recordingDialogTitle">
      <form id="recordingForm" class="recording-form">
        <header class="recording-dialog-header">
          <div>
            <span class="recording-eyebrow">DatasetRecorder</span>
            <h2 id="recordingDialogTitle">多摄像头同步录像</h2>
          </div>
          <button id="recordingCloseButton" class="dialog-close" type="button" aria-label="关闭">×</button>
        </header>

        <div id="recordingBanner" class="recording-banner idle" role="status">
          <span class="recording-status-dot" aria-hidden="true"></span>
          <div>
            <strong id="recordingStatusTitle">尚未开始录像</strong>
            <span id="recordingStatusDetail">开始前会检查所有摄像头是否在线</span>
          </div>
          <time id="recordingElapsed">00:00</time>
        </div>

        <div id="recordingCameraList" class="recording-camera-list" aria-label="录像摄像头状态"></div>

        <label class="recording-field">
          <span>录像编号</span>
          <input id="recordingSubjectId" name="subject_id" type="text" maxlength="40"
            pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,39}" placeholder="例如 base_ent_cam1_01" required>
          <small>仅允许字母、数字、下划线和短横线，作为录像目录名称。</small>
        </label>

        <label class="recording-field">
          <span>路线与备注</span>
          <textarea id="recordingNotes" name="notes" maxlength="300" rows="3"
            placeholder="例如 worker_001，cam_entrance → cam_1，单人基准"></textarea>
        </label>

        <div id="recordingSessionDetails" class="recording-session-details" hidden>
          <div><span>会话</span><strong id="recordingSessionId">—</strong></div>
          <div><span>保存目录</span><strong id="recordingDirectory">—</strong></div>
          <div><span>已写入</span><strong id="recordingFrameCount">0 帧</strong></div>
        </div>

        <p id="recordingError" class="recording-error" role="alert" hidden></p>

        <footer class="recording-actions">
          <button id="recordingCancelButton" class="secondary-button" type="button">关闭</button>
          <button id="recordingStopButton" class="recording-stop-button" type="button" hidden>停止并保存</button>
          <button id="recordingStartButton" class="recording-start-button" type="submit">开始三路录像</button>
        </footer>
      </form>
    </dialog>
    <script src="/static/app.js"></script>
  </body>
</html>
